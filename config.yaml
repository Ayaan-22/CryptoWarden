# CryptoWarden 3.0 — endpoint console. See README.md for response limitations.
monitoring:
  directories:
    - "%USERPROFILE%/Documents"
    - "%USERPROFILE%/Desktop"
    - "%USERPROFILE%/Pictures"
  ignored_extensions: [".tmp", ".log"]
  ignored_directories: [".git", ".venv", ".codex_deps", ".cryptowarden", "__pycache__", ".pytest_cache", ".agents"]
  queue_capacity: 4096
  poll_interval: 1.0
detection:
  max_modifications_per_sec: 5
  window_seconds: 10
  min_unique_files: 6
  rename_threshold: 4
  max_entropy_threshold: 7.5
  min_file_size_for_entropy: 1024
  entropy_check_samples: 8
  entropy_timeout: 2.0
  suspicious_extensions: [".enc", ".crypt", ".locked", ".wannacry", ".odin", ".zepto", ".locky", ".aes", ".cryptolocker"]
response:
  mode: alert_only
  terminate_tree: false
  cooldown_seconds: 30
  protected_processes: ["System", "Registry", "csrss.exe", "wininit.exe", "winlogon.exe", "services.exe", "lsass.exe"]
whitelist:
  processes: [] # Basename-only trust is not used. Manage identity-scoped rules in the console.
dashboard:
  host: "127.0.0.1"
  port: 8001
  auth_token: "" # Generated at startup. Prefer CRYPTOWARDEN_DASHBOARD_TOKEN.
  session_seconds: 3600
storage:
  directory: ".cryptowarden"
  retention_days: 30
  max_incidents: 10000
